<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Gride</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;

        }

        body {
            height: 100vh;
            width: 100vw;
        }

        .container {
            height: 100%;
            width: 100%;
            background-color: rgba(0, 0, 0, 0.571);
            display: grid;
            padding: 4rem;
            gap: 1rem;
            /* row-gap: 1rem; 
          column-gap: 1rem; */
            /* grid-template-rows: 100px 100px; 
           grid-template-rows: 1fr 1fr; 
           grid-template-columns: 100px 100px 100px ; */
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(4, 1fr);

        }

        .item {
            background-color: rgba(81, 52, 199, 0.578);
            border: 2px solid black;
            color: aliceblue;
            display: flex;
            font-size: 1.3rem;
            justify-content: center;
            text-align: center;

        }

        .header,
        .footer {
            background-color: blueviolet;
            border: 2px solid black;
            grid-column-start: 1;
            grid-column-end: 4;
            color: aliceblue;
            font-size: 1.5rem;
            padding: 25px;
            justify-content: center;
            text-align: center;

        }

        .sidebar {
            background-color: cadetblue;
            grid-row-start: 2;
            grid-row-end: 4;
            border: 2px solid black;
            color: aliceblue;
            font-size: 1.5rem;
            padding: 75px;
            justify-content: center;
            text-align: center;
        }

        .content-1 {
            background-color: aqua;
            grid-column-start: 2;
            grid-column-end: 4;
            border: 2px solid black;
            color: aliceblue;
            font-size: 1.5rem;
            padding: 25px;
            justify-content: center;
            text-align: center;
        }

       

@media (max-width: 768px) {
    .container {
        grid-template-columns: repeat(2, 1fr);
        grid-template-rows: auto;
    }

    .header,
    .footer {
        grid-column: 1 / 3;
    }

    .sidebar {
        grid-row: auto;
        grid-column: 1 / 3;
        padding: 30px;
    }

    .content-1 {
        grid-column: 1 / 3;
    }
}


@media (max-width: 480px) {
    .container {
        grid-template-columns: 1fr;
        padding: 1rem;
    }

    .header,
    .sidebar,
    .content-1,
    .item,
    .footer {
        grid-column: auto;
        grid-row: auto;
        padding: 20px;
    }
}

    

       
    </style>
</head>

<body>
    <div class="container">
        <div class="header">header</div>
        <div class="sidebar">sidebar</div>
        <div class="content-1">content-1</div>
        <div class="item">content-2</div>
        <div class="item">content-3</div>
        <div class="footer">footer</div>
    </div>
</body>

</html>
